<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post 1 - Botijão de Gás</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, Helvetica, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f0f0f0; }
    .post { width: 1200px; height: 900px; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 60px; }
    .circle { position: absolute; border-radius: 50%; opacity: 0.1; }
    .c1 { width: 500px; height: 500px; background: #e94560; top: -100px; right: -100px; }
    .c2 { width: 300px; height: 300px; background: #4a90d9; bottom: -50px; left: -50px; }
    .c3 { width: 200px; height: 200px; background: #e94560; bottom: 100px; right: 100px; }
    .content { position: relative; z-index: 1; text-align: center; color: white; }
    .icon { font-size: 100px; margin-bottom: 30px; }
    h1 { font-size: 72px; font-weight: 900; margin-bottom: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); line-height: 1.1; }
    h1 span { color: #e94560; }
    .sub { font-size: 28px; color: #ccc; margin-bottom: 40px; line-height: 1.4; }
    .cta { display: inline-block; background: #e94560; color: white; padding: 20px 50px; border-radius: 50px; font-size: 24px; font-weight: bold; text-decoration: none; }
    .footer { position: absolute; bottom: 30px; left: 0; right: 0; text-align: center; z-index: 1; }
    .footer p { color: rgba(255,255,255,0.5); font-size: 14px; line-height: 1.8; }
    .footer strong { color: rgba(255,255,255,0.7); }
  </style>
</head>
<body>
  <div class="post">
    <div class="circle c1"></div>
    <div class="circle c2"></div>
    <div class="circle c3"></div>
    <div class="content">
      <div class="icon"></div>
      <h1>BOTIJÃO DE GÁS<br><span>ENTREGA RÁPIDA</span></h1>
      <p class="sub">Peça agora e receba em até 20 minutos!<br>Gás de cozinha com qualidade e segurança.</p>
      <a class="cta" href="https://geovanegasdistritoindustrial.netlify.app/" target="_blank">SAIBA MAIS</a>
    </div>
    <div class="footer">
      <p>
        <strong>Geovane Gás</strong> | R. Segunda Rural, 179 - Distrito Industrial, Ananindeua-PA<br>
        <strong>SEO:</strong> botijão de gás | gás de cozinha | entrega de gás | gás butano | distribuidora de gás Ananindeua
      </p>
    </div>
  </div>
</body>
</html>
